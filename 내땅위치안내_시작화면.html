<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>내 땅 위치 안내 서비스</title>
<style>
  @import url('https://cdnjs.cloudflare.com/ajax/libs/pretendard/1.3.9/static/pretendard.css');

  :root{
    --green:#22A06B;      /* 여주시청 홈페이지 메인톤 */
    --green-dark:#178055;
    --blue:#2D7DD2;       /* 보조 포인트 */
    --orange:#F2994A;     /* 강조 포인트 */
    --ink:#2B2B2B;
    --paper:#FFFFFF;
    --sand:#F2F7F5;        /* 그린 톤과 어울리는 옅은 배경 */
    --line:#DCE6E1;
    --ok-bg:#EAF6EF;
    --ok-line:var(--green);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Pretendard','Noto Sans KR',sans-serif;
    background:var(--sand);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  .phone{
    width:100%;
    max-width:480px;
    min-height:100vh;
    background:var(--paper);
    display:flex;
    flex-direction:column;
    box-shadow:0 0 40px rgba(89,87,87,0.12);
  }

  /* ---------- Header : 여주 워드마크 반영 ---------- */
  header{
    background:linear-gradient(135deg, var(--green), var(--blue));
    color:#fff;
    padding:18px 22px 26px;
    text-align:center;
    position:relative;
    overflow:hidden;
    min-height:104px;
  }
  /* 그래픽 모티프(BS09 Type B) 오마주 : 가늘게 흐르는 라인 */
  header::before{
    content:"";
    position:absolute;
    right:-30px; top:-40px;
    width:160px; height:160px;
    border:3px solid rgba(255,255,255,0.16);
    border-radius:50%;
  }
  header::after{
    content:"";
    position:absolute;
    left:-20px; bottom:-50px;
    width:120px; height:120px;
    border:3px solid rgba(201,160,89,0.35);
    border-radius:50%;
  }
  .logo-wrap{
    position:absolute;
    top:14px; left:18px;
    z-index:2;
  }
  .logo-img{
    display:block;
    height:32px;
    width:auto;
  }
  .header-title{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100%;
    padding-top:8px;
  }
  header .dept{
    position:relative;
    font-size:14px;
    letter-spacing:0.02em;
    opacity:0.92;
    margin:0 0 4px;
  }
  header h1{
    position:relative;
    font-size:28px;
    font-weight:800;
    margin:0;
    line-height:1.35;
  }

  main{
    flex:1;
    padding:32px 24px 40px;
    display:flex;
    flex-direction:column;
  }
  .screen{ display:none; flex-direction:column; flex:1; }
  .screen.active{ display:flex; }

  .lead{
    font-size:19px;
    line-height:1.6;
    color:var(--ink);
    margin:0 0 28px;
    text-align:center;
  }

  label.field-label{
    font-size:20px;
    font-weight:700;
    color:var(--ink);
    margin-bottom:10px;
    display:block;
  }

  input[type=text]{
    width:100%;
    font-size:26px;
    padding:20px 18px;
    border:3px solid var(--line);
    border-radius:14px;
    font-family:inherit;
    margin-bottom:22px;
    background:var(--sand);
    color:var(--ink);
  }
  input[type=text]:focus{
    outline:none;
    border-color:var(--green);
    background:#fff;
  }
  input[type=text]::placeholder{ color:#9AAFA6; }

  .btn{
    display:block;
    width:100%;
    font-size:26px;
    font-weight:800;
    padding:22px 0;
    border-radius:14px;
    border:none;
    cursor:pointer;
    font-family:inherit;
  }
  .btn-primary{
    background:var(--green);
    color:#fff;
  }
  .btn-primary:active{ background:var(--green-dark); }
  .btn-secondary{
    background:#fff;
    color:var(--green);
    border:3px solid var(--green);
    margin-top:14px;
  }

  .helper-note{
    margin-top:auto;
    padding-top:28px;
    text-align:center;
  }
  .helper-note p{
    font-size:18px;
    color:#5A6B63;
    background:var(--sand);
    border-left:5px solid var(--orange);
    border-radius:12px;
    padding:16px 18px;
    margin:0;
    line-height:1.6;
    text-align:left;
    flex:1;
  }
  .helper-note{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .mascot-img{
    width:56px;
    height:56px;
    flex-shrink:0;
    object-fit:contain;
  }

  .loading-box{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:20px;
  }
  .spinner{
    width:56px; height:56px;
    border:6px solid var(--line);
    border-top-color:var(--green);
    border-radius:50%;
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .loading-box p{ font-size:20px; color:#5A6B63; font-weight:700; }

  .result-card{
    background:var(--ok-bg);
    border:2px solid var(--ok-line);
    border-radius:16px;
    padding:20px;
    margin-bottom:20px;
  }
  .result-card .addr-label{
    font-size:16px;
    color:#1E8449;
    font-weight:700;
    margin:0 0 6px;
  }
  .result-card .addr-value{
    font-size:22px;
    color:var(--ink);
    font-weight:800;
    margin:0;
  }

  .map-box{
    background:#E4F0EA;
    border-radius:16px;
    height:280px;
    position:relative;
    overflow:hidden;
    margin-bottom:22px;
    border:2px solid var(--line);
  }
  .map-box svg, .map-box img{ width:100%; height:100%; display:block; object-fit:cover; }
  .map-demo-badge{
    position:absolute; top:10px; right:10px;
    background:rgba(43,43,43,0.82);
    color:#fff;
    font-size:12px;
    padding:5px 10px;
    border-radius:999px;
  }

  .result-actions .btn{ margin-bottom:14px; }

  .error-box{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:14px;
  }
  .error-box .error-mascot{
    width:96px;
    height:96px;
    object-fit:contain;
  }
  .error-box p{ font-size:20px; color:var(--ink); line-height:1.6; margin:0; }
  .error-box .sub{ font-size:17px; color:#5A6B63; }

  footer{
    text-align:center;
    padding:16px;
    font-size:12px;
    color:#9AAFA6;
    border-top:1px solid var(--line);
  }
</style>
</head>

<script>
const VWORLD_KEY = '91C05FBD-B209-4B28-922E-AAF61016F187';

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function goInput(){ showScreen('screen-input'); }

function doSearch(){
  const addr = document.getElementById('inp-addr').value.trim();
  if(!addr){ document.getElementById('inp-addr').focus(); return; }
  showScreen('screen-loading');
  searchWithVWorld(addr);
}

/*
  JSONP 유틸리티
  브이월드 API가 CORS(Access-Control-Allow-Origin) 헤더를 안 주는 경우가 있어,
  <script> 태그로 우회하는 JSONP 방식을 사용합니다. (실제 개발 사례에서
  dataType:'jsonp'로 CORS를 우회한 선례를 참고했습니다.)
*/
function jsonp(url, callbackParam = 'callback', timeoutMs = 8000){
  return new Promise((resolve, reject) => {
    const callbackName = 'vworld_cb_' + Date.now() + '_' + Math.floor(Math.random()*10000);
    const script = document.createElement('script');
    let done = false;

    function cleanup(){
      delete window[callbackName];
      script.remove();
      clearTimeout(timer);
    }

    window[callbackName] = (data) => {
      done = true;
      resolve(data);
      cleanup();
    };

    script.onerror = () => {
      if(!done){ reject(new Error('JSONP script load error')); cleanup(); }
    };

    const timer = setTimeout(() => {
      if(!done){ reject(new Error('JSONP timeout')); cleanup(); }
    }, timeoutMs);

    script.src = `${url}&${callbackParam}=${callbackName}`;
    document.body.appendChild(script);
  });
}

async function searchWithVWorld(addr){
  const domain = location.hostname; // 지금 열려있는 페이지의 실제 도메인을 자동으로 사용
  const url = `https://api.vworld.kr/req/address?service=address&request=getcoord`
    + `&version=2.0&crs=epsg:4326&address=${encodeURIComponent(addr)}`
    + `&refine=true&simple=false&format=json&type=PARCEL&key=${VWORLD_KEY}&domain=${domain}`;
  try{
    const data = await jsonp(url, 'callback');
    if(data.response && data.response.status === 'OK'){
      const point = data.response.result.point;
      document.getElementById('result-addr').textContent = addr;
      showResultMap(point.x, point.y);
      showScreen('screen-result');
    } else if(data.response && data.response.status === 'NOT_FOUND'){
      showError('입력하신 정보로<br>위치를 찾지 못했어요','지번을 다시 확인해 주시거나<br>도우미에게 말씀해 주세요');
    } else {
      showError('조회 중 문제가 발생했어요','잠시 후 다시 시도해 주세요 (상태: ' + (data && data.response && data.response.status) + ')');
    }
  } catch(e){
    showError('지금은 조회할 수 없어요','JSONP 방식도 실패했습니다.<br>브이월드 고객센터 문의가 필요할 수 있어요');
  }
}

function showResultMap(lon, lat){
  const d = 0.0015;
  const bbox = [lat-d, lon-d, lat+d, lon+d].join(',');
  const domain = location.hostname;
  const wmsUrl = `https://api.vworld.kr/req/wms?SERVICE=WMS&REQUEST=GetMap&VERSION=1.3.0`
    + `&LAYERS=lp_pa_cbnd_bubun&STYLES=&CRS=EPSG:4326&BBOX=${bbox}`
    + `&WIDTH=600&HEIGHT=400&FORMAT=image/png&TRANSPARENT=false&KEY=${VWORLD_KEY}&DOMAIN=${domain}`;
  const box = document.getElementById('map-box');
  const badge = document.getElementById('map-badge');
  const svg = document.getElementById('map-demo-svg');
  const img = new Image();
  console.log('[디버그] 지도 요청 URL:', wmsUrl);
  img.onload = () => { svg.remove(); box.insertBefore(img, badge); badge.textContent = '브이월드 지적도'; };
  img.onerror = () => { badge.textContent = '데모 화면'; console.log('[디버그] 지도 이미지 로드 실패. 위 URL을 새 탭에 붙여넣으면 브이월드의 실제 에러 메시지를 볼 수 있어요.'); };
  img.src = wmsUrl;
}

function showError(msg, sub){
  document.getElementById('error-msg').innerHTML = msg;
  document.getElementById('error-sub').innerHTML = sub;
  showScreen('screen-error');
}
</script>
